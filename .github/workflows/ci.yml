name: Software checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Hardware profile validation
        run: python -m udp.hardware
      - name: Generated firmware config matches hardware profile
        run: python -m udp.builder --check
      - name: Protocol and simulator unit tests
        run: python -m unittest discover -s tests -v
